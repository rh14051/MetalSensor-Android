name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          APK_NAME="MetalSensor-v${VERSION}-${{ github.run_number }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetalSensor-debug-apk
          path: ${{ env.APK_NAME }}

      - name: Create GitHub Release
        run: |
          gh release create "v${{ github.run_number }}" "$APK_NAME" \
            --title "MetalSensor APK - build ${{ github.run_number }}" \
            --notes "اپلیکیشن سنسور فلز — نسخه دیباگ قابل نصب

          برای نصب: فایل APK را دانلود کنید و روی گوشی باز کنید.
          اگر پیام «نصب از منابع ناشناس» آمد، اجازه بدهید." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
